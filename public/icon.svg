<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F62440" />
      <stop offset="100%" stop-color="#C2132A" />
    </linearGradient>
    
    <!-- Food Gold Highlight -->
    <linearGradient id="goldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#FFD54F" />
    </linearGradient>

    <!-- Glossy Overlay Gradient -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Smooth Rounded Card / Circle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Glossy Diagonal Finish -->
  <path d="M 0 0 L 512 0 L 512 256 Q 256 320 0 256 Z" fill="url(#gloss)" />

  <!-- Outer Ring Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="8" />

  <!-- Main Food Cloche (Sleek Cover) Graphic with Shadow -->
  <g filter="url(#shadow)">
    <!-- Steaming Waves (Fresh & Hot) -->
    <path d="M 216 110 Q 226 90 216 70" fill="none" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <path d="M 256 100 Q 266 80 256 60" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9" />
    <path d="M 296 110 Q 306 90 296 70" fill="none" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round" opacity="0.85" />

    <!-- Cloche Lid Handle / Ring -->
    <circle cx="256" cy="140" r="16" fill="none" stroke="url(#goldGradient)" stroke-width="10" />

    <!-- Cloche Dome (Lid) -->
    <path d="M 136 290 C 136 185 200 160 256 160 C 312 160 376 185 376 290 Z" fill="#FFFFFF" />

    <!-- Cloche Reflection Highlight -->
    <path d="M 170 280 C 170 210 210 185 250 180" fill="none" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" opacity="0.5" />

    <!-- Cloche Handle Base Line -->
    <rect x="236" y="152" width="40" height="10" rx="5" fill="url(#goldGradient)" />

    <!-- Cloche Bottom Tray Plate -->
    <path d="M 100 300 C 100 295 105 290 115 290 L 397 290 C 407 290 412 295 412 300 C 412 308 400 316 380 318 L 132 318 C 112 316 100 308 100 300 Z" fill="url(#goldGradient)" />
    
    <!-- Tray Bottom Rim -->
    <path d="M 140 318 C 140 334 160 342 256 342 C 352 342 372 334 372 318 Z" fill="#E65100" />
  </g>

  <!-- Bottom Label Branding -->
  <text x="256" y="440" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    ARWALEATS
  </text>
</svg>
